<!doctype html>
<meta charset="utf-8">
<!--
  Tarjeta para compartir en WhatsApp, Facebook, LinkedIn y X.
  1200x630 es la proporción 1.91:1 que piden todos; por debajo de 300x200
  WhatsApp degrada a miniatura cuadrada y por encima de ~600 KB no la
  muestra, así que sale en JPEG.
  Emblema a la izquierda y texto a la derecha: en el ancho de la burbuja
  de WhatsApp una composición apilada deja el nombre demasiado pequeño.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    color:#fff;
    background:
      radial-gradient(68% 54% at 90% 4%,rgba(5,140,187,.30),transparent 62%),
      radial-gradient(60% 48% at 4% 98%,rgba(138,195,45,.26),transparent 64%),
      linear-gradient(160deg,#0B2E1F 0%,#0F3A28 52%,#14472F 100%);
  }
  /* la misma regla de degradado que abre cada panel oscuro del sitio */
  body::before{
    content:'';position:absolute;top:0;left:0;right:0;height:9px;
    background:linear-gradient(90deg,#8AC32D,#058CBB,#A8E05A,#3FB4DD,#8AC32D);
  }
  .caja{
    position:absolute;inset:0;display:flex;align-items:center;gap:62px;
    padding:0 86px;
  }
  .sello{
    width:272px;height:272px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 76px -10px rgba(138,195,45,.6);
  }
  .tx{min-width:0}
  .ceja{
    display:flex;align-items:center;gap:16px;
    font-size:21px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:#A8E05A;margin-bottom:20px;
  }
  .ceja::before{content:'';width:46px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#8AC32D,#058CBB)}
  h1{
    font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;
    font-size:72px;line-height:1.02;letter-spacing:-.025em;
  }
  h1 span{color:#3FB4DD}
  .lema{
    font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:32px;
    color:rgba(255,255,255,.86);margin-top:22px;line-height:1.3;
  }
  .pie{
    margin-top:30px;display:flex;align-items:center;gap:14px;
    font-size:22px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:.02em;
  }
  .pie b{color:#fff;font-weight:600}
  .punto{width:5px;height:5px;border-radius:50%;background:#8AC32D;flex-shrink:0}
</style>

<div class="caja">
  <img class="sello" src="logo.webp" alt="">
  <div class="tx">
    <div class="ceja">ONG colombiana</div>
    <h1>Corporación<br><span>Protectora Verde</span></h1>
    <div class="lema">Unidos por la humanidad, guiados por el corazón</div>
    <div class="pie">
      <b>corporacionprotectoraverde.ong</b>
    </div>
  </div>
</div>
