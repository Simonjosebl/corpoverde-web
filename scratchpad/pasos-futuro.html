<!doctype html>
<meta charset="utf-8">
<!--
  Versión horizontal del logotipo de la Fundación Pasos para el Futuro.
  Misma huella y mismos colores que el original apilado; lo que cambia es
  la disposición: el símbolo a la izquierda y las dos líneas a la derecha.
  Razón 5:1, que es lo que piden los dos contenedores donde aparece en la
  web (el marco de 250x64 de la tarjeta de aliado y los 190x34 del pie).
  Apilado, la línea principal caía a 6,6 px de altura de caja y no se leía.
-->
